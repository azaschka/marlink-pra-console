<mat-toolbar class="topbar mat-bg-card">
    <!-- Sidenav toggle button -->
    <button *ngIf="layoutConf.sidebarStyle !== 'compact'" mat-icon-button id="sidenavToggle" (click)="toggleSidenav()"
        matTooltip="Toggle Hide/Open">
        <mat-icon>menu</mat-icon>
    </button>

    <div class="ml-24" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="32px">
        <app-breadcrumb></app-breadcrumb>
        <!-- <ng-container *ngIf="showInstanceSelector && instances.length > 0">
            <span>on</span>
        </ng-container> -->
        <ng-container *ngIf="showInstanceSelector && filteredInstances.length > 0">
            <mat-form-field style="width: 320px;">
                <mat-select [value]="selectedInstanceId" (selectionChange)="onInstanceChange($event.value)"
                    [disabled]="filteredInstances.length === 0">
                    <mat-option *ngFor="let instance of filteredInstances" [value]="instance.id">
                        {{ instance.name }} (ID: {{ instance.id }})
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </ng-container>
    </div>

    <span fxFlex></span>

    <!-- Notification toggle button -->
    <button mat-icon-button matTooltip="Notifications" (click)="toggleNotific()" [style.overflow]="'visible'"
        class="topbar-button-right" disabled>
        <mat-icon>notifications</mat-icon>
        <!-- <span class="notification-number mat-bg-warn">3</span> -->
    </button>

    <!-- Top left user menu -->
    <!-- <button mat-icon-button [matMenuTriggerFor]="accountMenu" class="topbar-button-right img-button">
        <mat-icon>settings</mat-icon>
    </button>
    <mat-menu #accountMenu="matMenu">
        <button mat-menu-item [routerLink]="['/profile/overview']">
            <mat-icon>account_box</mat-icon>
            <span>Profile</span>
        </button>
        <button mat-menu-item [routerLink]="['/profile/settings']">
            <mat-icon>settings</mat-icon>
            <span>Account Settings</span>
        </button>
        <button mat-menu-item>
            <mat-icon>notifications_off</mat-icon>
            <span>Disable alerts</span>
        </button>
        <button mat-menu-item (click)="logoutUser()">
            <mat-icon>exit_to_app</mat-icon>
            <span>{{ "SIGNOUT" | translate }}</span>
        </button>
    </mat-menu> -->

    <button mat-icon-button class="topbar-button-right img-button" (click)="logoutUser()">
        <mat-icon>exit_to_app</mat-icon>
    </button>
</mat-toolbar>
