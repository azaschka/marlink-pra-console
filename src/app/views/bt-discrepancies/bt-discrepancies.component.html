<div>
    <div class="m-8 mt-16">
        <!-- filter -->
        <div class="pr-16" fxFlex="33">
            <mat-form-field class="full-width m-16">
                <input matInput placeholder="Type to filter all columns" [disabled]="!dataSource?.data?.length"
                    [(ngModel)]="filterValue" (ngModelChange)="applyFilter()" />
                <button *ngIf="filterValue" matSuffix mat-icon-button aria-label="Clear" (click)="removeFilter()">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
        </div>
        <div fxFlex></div>
        <div class="pl-16">
            <button mat-stroked-button class="m-16" color="primary" (click)="syncAllExternalHandler()"
                [disabled]="isLoading || isScanning || isSyncingAllExternal"
                matTooltip="Apply BeyondTrust data to all discrepancies (ExternalToInternal)">
                <span *ngIf="!isSyncingAllExternal" translate="views.bt-discrepancies.buttons.syncAllExternal"></span>
                <span *ngIf="isSyncingAllExternal">Syncing…</span>
            </button>
            <button mat-raised-button class="m-16" color="primary" (click)="scanAllHandler()"
                [disabled]="isLoading || isScanning">
                <span *ngIf="!isScanning" translate="views.bt-discrepancies.buttons.scanAll"></span>
                <span *ngIf="isScanning">Scanning…</span>
            </button>
            <p *ngIf="syncAllExternalError" class="scan-error-message">{{ syncAllExternalError }}</p>
            <p *ngIf="scanError" class="scan-error-message">{{ scanError }}</p>
        </div>
    </div>

    <mat-card class="p-0">
        <mat-card-content class="p-0">
            <mat-table [dataSource]="dataSource" matSort matSortActive="creationDate" matSortDirection="desc">
                <!-- Loader -->
                <ng-container matColumnDef="loader">
                    <mat-header-cell *matHeaderCellDef [attr.colspan]="displayedColumns.length">
                        <mat-progress-bar mode="indeterminate" color="primary" class="absolute"></mat-progress-bar>
                    </mat-header-cell>
                    <mat-cell *matCellDef="let row"></mat-cell>
                </ng-container>

                <!-- ID -->
                <ng-container matColumnDef="id">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>ID</mat-header-cell>
                    <mat-cell *matCellDef="let row">{{ row.id || '—' }}</mat-cell>
                </ng-container>

                <!-- Entity Type -->
                <ng-container matColumnDef="entityType">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Entity Type</mat-header-cell>
                    <mat-cell *matCellDef="let row">
                        {{ getEntityTypeLabel(row.entityType) || '—' }}
                    </mat-cell>
                </ng-container>

                <!-- Data Diff -->
                <ng-container matColumnDef="diff">
                    <mat-header-cell *matHeaderCellDef>Differences (PRA Platform ↔ BeyondTrust)</mat-header-cell>
                    <mat-cell *matCellDef="let row" class="diff-cell">
                        <div [innerHTML]="getDiffHtml(row)" class="diff-container"></div>
                    </mat-cell>
                </ng-container>

                <!-- Creation Date -->
                <ng-container matColumnDef="creationDate">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Creation&nbsp;Date</mat-header-cell>
                    <mat-cell *matCellDef="let row">{{ row.creationDate | date : "dd.MM.yy - HH:mm:ss" }}</mat-cell>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                    <mat-header-cell *matHeaderCellDef></mat-header-cell>
                    <mat-cell *matCellDef="let row">
                        <button mat-icon-button class="sync-btn-red" matTooltip="Apply PRA Platform Data"
                            (click)="syncDiscrepancyHandler(row, DiscrepancySyncType.InternalToExternal); $event.stopPropagation()">
                            <mat-icon>cloud_upload</mat-icon>
                        </button>

                        <button mat-icon-button class="sync-btn-green" matTooltip="Apply BeyondTrust Data"
                            (click)="syncDiscrepancyHandler(row, DiscrepancySyncType.ExternalToInternal); $event.stopPropagation()">
                            <mat-icon>cloud_download</mat-icon>
                        </button>
                    </mat-cell>
                </ng-container>

                <!-- Header / Rows -->
                <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                <mat-header-row *matHeaderRowDef="['loader']; sticky: true" class="progress-row"
                    [class.hidden]="!isLoading"></mat-header-row>
                <mat-row class="selectable" [class.expanded]="expandedRowId === row.id"
                    *matRowDef="let row; columns: displayedColumns" (click)="toggleRowExpansion(row)"
                    [matTooltip]="expandedRowId === row.id ? 'Click to hide unchanged values' : 'Click to show all data'">
                </mat-row>

                <!-- No-data -->
                <tr class="mat-row" *matNoDataRow style="display: flex">
                    <td class="mat-cell full-width pt-12" [attr.colspan]="displayedColumns.length">
                        No discrepancies found.
                    </td>
                </tr>
            </mat-table>

            <mat-paginator #tablePaginator [length]="dataCount" [pageSize]="defaultPageSize"
                [pageSizeOptions]="pageSizeOptions" showFirstLastButtons></mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
