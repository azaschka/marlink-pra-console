<mat-card class="my-0 p-0" style="height: 100%;">
    <mat-card-title class="mb-0">
        <div class="card-title-text">
            <span class="text-13 pt-4" translate="views.dashboard.health.headline"></span>

            <span fxFlex></span>
        </div>
        <mat-divider></mat-divider>
        <mat-progress-bar *ngIf="isLoading" mode="indeterminate" color="primary"></mat-progress-bar>
    </mat-card-title>

    <mat-card-content class="my-0 p-0">
        <div *ngIf="isUnreachable" class="health-banner text-13 text-warn" role="status">
            <span translate="views.dashboard.health.unreachable"></span>
            <span *ngIf="lastUpdated">
                {{ "views.dashboard.health.lastUpdated" | translate: { time: lastUpdated } }}
            </span>
        </div>

        <mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="status">
                <mat-cell *matCellDef="let row" data-label="status">
                    <div
                        class="status-light cursor-pointer"
                        [ngClass]="row.cssClass"
                        [matTooltip]="row.tooltip"
                        matTooltipClass="multiline-tooltip"
                    ></div>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="name">
                <mat-cell *matCellDef="let row" data-label="name" [matTooltip]="row.tooltip" matTooltipClass="multiline-tooltip">
                    {{ row.displayName }}
                </mat-cell>
            </ng-container>

            <mat-row *matRowDef="let row; columns: displayedColumns" [class.stale]="row.stale"></mat-row>
        </mat-table>
    </mat-card-content>
</mat-card>
