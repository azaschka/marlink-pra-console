<div class="relative">
    <div *ngIf="isLoading" class="absolute mb-16 loader">
        <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
    </div>

    <button *ngIf="!isLoading" mat-mini-fab color="primary" class="close-button" (click)="closeDialog()">
        <mat-icon>close</mat-icon>
    </button>

    <h2 matDialogTitle translate="views.management.hxConfigs.modal.headlineAdd"></h2>

    <form [formGroup]="hxConfigFormGroup" (ngSubmit)="submitHxConfigHandler()" style="width: 720px">
        <div fxLayout="row wrap" fxLayout.lt-sm="column">
            <div fxFlex="100" class="pr-16">
                <mat-form-field class="full-width">
                    <input matInput type="text" formControlName="hxServerName" placeholder="HX Server Name" required />
                    <mat-error *ngIf="hxServerName.hasError('required')">
                        HX server name is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>

            <div fxFlex="100" class="pr-16">
                <mat-form-field class="full-width">
                    <input matInput type="text" formControlName="hxServerUrl" placeholder="HX Server URL" required />
                    <mat-error *ngIf="hxServerUrl.hasError('required')">
                        HX server url is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>

            <div fxFlex="100" class="pr-16">
                <mat-form-field class="full-width">
                    <input matInput type="text" formControlName="hxApiUrl" placeholder="HX API URL" required />
                    <mat-error *ngIf="hxApiUrl.hasError('required')">
                        HX api url is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>

            <div fxFlex="50" class="pr-16">
                <mat-form-field class="full-width">
                    <input matInput type="text" formControlName="hxApiUser" placeholder="HX API User" required />
                    <mat-error *ngIf="hxApiUser.hasError('required')">
                        HX api user is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>

            <div fxFlex="50" class="pr-16">
                <mat-form-field class="full-width">
                    <input matInput type="text" formControlName="hxApiPass" placeholder="HX API Password" required />
                    <mat-error *ngIf="hxApiPass.hasError('required')">
                        HX api pass is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>

            <div fxFlex="100" class="pr-16">
                <app-file-drag-area *ngIf="!hasProcessedJsonFile" class="full-width" [acceptedFileEndings]="
                        AddHxConfigOverlayComponent.ACCEPTED_FILE_EXTENSIONS
                    " [multipleFiles]="true" dragAreaHint="{{
                        'views.management.hxConfigs.modal.hintDragAndDrop'
                            | translate
                    }}" dragAreaHeight="160" (importedFiles)="onFileInput($event)"></app-file-drag-area>

                <mat-form-field *ngIf="hasProcessedJsonFile" class="full-width">
                    <textarea matInput type="text" rows="10" formControlName="hxConfigJson"
                        placeholder="HX Config JSON"></textarea>
                    <mat-error *ngIf="hxConfigJson.hasError('required')">
                        HX Config JSON is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>

            <div fxFlex="100" class="pr-16 mt-16 mb-16">
                <mat-slide-toggle formControlName="isDefault" (change)="isDefaultToggleChangeHandler($event)">{{
                        isDefault.value
                            ? "Default HX Server Configuration"
                            : "Set as a default HX Server Configuration"
                    }}</mat-slide-toggle>
            </div>

            <div fxFlex="100" class="mt-16">
                <span fxFlex></span>
                <button mat-raised-button color="primary" [disabled]="hxConfigFormGroup.invalid || isLoading">
                    {{ "general.buttons.save" | translate }}
                </button>
            </div>
        </div>
    </form>
</div>
