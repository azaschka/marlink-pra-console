<div>
    <div class="m-8 mt-16">
        <!-- filter -->
        <div class="pr-16" fxFlex="33">
            <mat-form-field class="full-width m-16">
                <input matInput placeholder="Type to filter all columns" [disabled]="!dataSource?.data?.length"
                    [(ngModel)]="filterValue" (ngModelChange)="applyFilter()" />
                <button *ngIf="filterValue" matSuffix mat-icon-button aria-label="Clear" (click)="removeFilter()">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
        </div>
        <div fxFlex></div>
        <div class="pl-16">
            <!-- <a mat-stroked-button color="primary" class="m-16" csvLink [data]="dataSource.data"
                                [filename]="generateCsvExportFileName()">
                                Export CSV
                            </a> -->
            <a mat-stroked-button color="primary" class="m-16" translate="views.group-policies.buttons.export"
                disabled></a>
        </div>
    </div>

    <mat-card class="p-0">
        <mat-card-content class="p-0">
            <mat-table [dataSource]="dataSource" matSort>
                <!-- Loader -->
                <ng-container matColumnDef="loader">
                    <mat-header-cell *matHeaderCellDef [attr.colspan]="displayedColumns.length">
                        <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
                    </mat-header-cell>
                    <mat-cell *matCellDef="let row"></mat-cell>
                </ng-container>

                <!-- Name -->
                <ng-container matColumnDef="name">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
                    <mat-cell *matCellDef="let row">{{ row.name }}</mat-cell>
                </ng-container>

                <!-- Access Status -->
                <ng-container matColumnDef="accessPermissionStatusType">
                    <mat-header-cell *matHeaderCellDef>Access Status</mat-header-cell>
                    <mat-cell *matCellDef="let row">
                        <div class="status-light"
                            matTooltip="{{ getAccessStatusTooltip(row.accessPermissionStatusType) }}"
                            [ngClass]="getAccessStatusLightColor(row.accessPermissionStatusType)"></div>
                    </mat-cell>
                </ng-container>

                <!-- Endpoints Access -->
                <ng-container matColumnDef="hasEndpointsAccessPermission">
                    <mat-header-cell *matHeaderCellDef
                        matTooltip="Indicates whether the group policy users can access endpoints.">Endpoints</mat-header-cell>
                    <mat-cell *matCellDef="let row">
                        <div class="status-light" [ngClass]="row.hasEndpointsAccessPermission ? 'ok' : 'error'"></div>
                    </mat-cell>
                </ng-container>

                <!-- Share With Other Team -->
                <ng-container matColumnDef="hasShareOtherTeamPermission">
                    <mat-header-cell *matHeaderCellDef
                        matTooltip="Indicates whether the group policy users can share sessions with teams they do not belong to.">Share</mat-header-cell>
                    <mat-cell *matCellDef="let row">
                        <div class="status-light" [ngClass]="row.hasShareOtherTeamPermission ? 'ok' : 'error'"></div>
                    </mat-cell>
                </ng-container>

                <!-- Invite External -->
                <ng-container matColumnDef="hasInviteExternalUserPermission">
                    <mat-header-cell *matHeaderCellDef
                        matTooltip="Indicates whether the group policy users can invite external users.">Invite</mat-header-cell>
                    <mat-cell *matCellDef="let row">
                        <div class="status-light" [ngClass]="row.hasInviteExternalUserPermission ? 'ok' : 'error'">
                        </div>
                    </mat-cell>
                </ng-container>

                <!-- Last Sync Date -->
                <ng-container matColumnDef="lastSyncDate">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Last&nbsp;Sync&nbsp;Date</mat-header-cell>
                    <mat-cell *matCellDef="let row">{{ row.lastSyncDate | date : "dd.MM.yy - HH:mm:ss" }}</mat-cell>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                    <mat-header-cell *matHeaderCellDef></mat-header-cell>
                    <mat-cell *matCellDef="let row">
                        <button mat-icon-button color="primary" (click)="editGroupPolicyHandler(row)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" [class.disabled]="!canDelete"
                            (click)="deleteGroupPolicyHandler(row)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </mat-cell>
                </ng-container>

                <!-- Header / Rows -->
                <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                <mat-header-row *matHeaderRowDef="['loader']; sticky: true" class="progress-row"
                    [class.hidden]="!isLoading"></mat-header-row>
                <mat-row class="selectable" *matRowDef="let row; columns: displayedColumns"></mat-row>

                <!-- No-data -->
                <tr class="mat-row" *matNoDataRow style="display: flex">
                    <td class="mat-cell full-width pt-12" [attr.colspan]="displayedColumns.length">
                        No group policies found.
                    </td>
                </tr>
            </mat-table>

            <mat-paginator #tablePaginator [length]="dataCount" [pageSize]="defaultPageSize"
                [pageSizeOptions]="pageSizeOptions" showFirstLastButtons></mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
