<div class="relative overlay-container">
    <div *ngIf="isLoading" class="absolute overlay-loader">
        <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
    </div>

    <button *ngIf="!isLoading" mat-mini-fab color="primary" class="overlay-close-button" (click)="cancel()">
        <mat-icon>close</mat-icon>
    </button>

    <h2 matDialogTitle class="mb-32">{{ displayHeadline() }}</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" style="width: 480px;">
        <div fxLayout="row wrap">
            <!-- Name (readonly) -->
            <div fxFlex="100">
                <mat-form-field class="full-width">
                    <mat-label>{{ displayJumpAssetName() }}</mat-label>
                    <input matInput [value]="data.currentName" readonly />
                </mat-form-field>
            </div>

            <!-- Jump Group -->
            <div fxFlex="100" class="mt-16">
                <mat-form-field class="full-width">
                    <mat-label>Jump Group</mat-label>
                    <input type="text" matInput [matAutocomplete]="autoJumpGroup" formControlName="jumpGroup" />
                    <mat-autocomplete #autoJumpGroup="matAutocomplete" [displayWith]="displayJumpGroup">
                        <mat-option *ngFor="let group of filteredJumpGroups$ | async" [value]="group">
                            {{ group.name }}
                        </mat-option>
                    </mat-autocomplete>
                    <mat-error *ngIf="form.get('jumpGroup')?.hasError('required')">
                        Jump Group is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>

            <!-- Jump Policy -->
            <div fxFlex="100" class="mt-16">
                <mat-form-field class="full-width">
                    <mat-label>Jump Policy</mat-label>
                    <input type="text" matInput [matAutocomplete]="autoJumpPolicy" formControlName="jumpPolicy" />
                    <mat-autocomplete #autoJumpPolicy="matAutocomplete" [displayWith]="displayJumpPolicy">
                        <mat-option [value]="null">— No Jump Policy —</mat-option>
                        <mat-option *ngFor="let policy of filteredJumpPolicies$ | async" [value]="policy">
                            {{ policy.displayName }}
                        </mat-option>
                    </mat-autocomplete>
                </mat-form-field>
            </div>

            <!-- Submit -->
            <div fxFlex="100" class="mt-16" fxLayout="row" fxLayoutAlign="end center">
                <div fxLayout="row" fxLayoutAlign="end center" class="mt-32">
                    <button mat-raised-button color="primary" [disabled]="form.invalid || isLoading">Update</button>
                </div>
            </div>
        </div>
    </form>
</div>
