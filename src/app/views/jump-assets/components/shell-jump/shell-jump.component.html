<div>
    <div class="m-8 mt-16">
        <div class="pr-16" fxFlex="33">
            <mat-form-field class="full-width m-16">
                <input matInput placeholder="Type to filter all columns" [disabled]="!dataSource?.data?.length"
                    [(ngModel)]="filterValue" (ngModelChange)="applyFilter()" />
                <button *ngIf="filterValue" matSuffix mat-icon-button aria-label="Clear" (click)="removeFilter()">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
        </div>
        <div fxFlex></div>
        <div class="pl-16">
            <button mat-raised-button class="m-16" color="primary" (click)="addShellJumpHandler()">Add Shell
                Jump</button>
        </div>
    </div>

    <mat-card class="p-0">
        <mat-card-content class="p-0">
            <mat-table [dataSource]="dataSource" matSort>

                <!-- Loader -->
                <ng-container matColumnDef="loader">
                    <mat-header-cell *matHeaderCellDef [attr.colspan]="displayedColumns.length">
                        <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
                    </mat-header-cell>
                    <mat-cell *matCellDef="let row"></mat-cell>
                </ng-container>

                <!-- JumpGroup Name -->
                <ng-container matColumnDef="jumpGroupName">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>JumpGroup Name</mat-header-cell>
                    <mat-cell *matCellDef="let row"
                        [matTooltip]="row.jumpGroupName">{{ row.jumpGroupName || '—' }}</mat-cell>
                </ng-container>

                <!-- Tag -->
                <ng-container matColumnDef="tag">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Tag</mat-header-cell>
                    <mat-cell *matCellDef="let row" [matTooltip]="row.tag">{{ row.tag || '—' }}</mat-cell>
                </ng-container>

                <!-- IP / Host -->
                <ng-container matColumnDef="hostname">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>IP / Host</mat-header-cell>
                    <mat-cell *matCellDef="let row">{{ row.hostname }}</mat-cell>
                </ng-container>

                <!-- Port -->
                <ng-container matColumnDef="port">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Port</mat-header-cell>
                    <mat-cell *matCellDef="let row">{{ row.port }}</mat-cell>
                </ng-container>

                <!-- Name -->
                <ng-container matColumnDef="name">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
                    <mat-cell *matCellDef="let row" [matTooltip]="row.name">{{ row.name || '—' }}</mat-cell>
                </ng-container>

                <!-- Jumpoint Name -->
                <ng-container matColumnDef="jumpointName">
                    <mat-header-cell *matHeaderCellDef>Jumpoint Name</mat-header-cell>
                    <mat-cell *matCellDef="let row"
                        [matTooltip]="row.jumpointName">{{ row.jumpointName || '—' }}</mat-cell>
                </ng-container>

                <!-- Jump Policy Name -->
                <ng-container matColumnDef="jumpPolicyName">
                    <mat-header-cell *matHeaderCellDef>Jump Policy Name</mat-header-cell>
                    <mat-cell *matCellDef="let row"
                        [matTooltip]="row.jumpPolicyName">{{ row.jumpPolicyName || '—' }}</mat-cell>
                </ng-container>

                <!-- Last Sync Date -->
                <!-- <ng-container matColumnDef="lastSyncDate">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Last&nbsp;Sync&nbsp;Date</mat-header-cell>
                    <mat-cell *matCellDef="let row">{{ row.lastSyncDate | date : "dd.MM.yy - HH:mm:ss" }}</mat-cell>
                </ng-container> -->

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                    <mat-header-cell *matHeaderCellDef></mat-header-cell>
                    <mat-cell *matCellDef="let row">
                        <button mat-icon-button color="primary" (click)="copyShellJumpHandler(row)"
                            matTooltip="Copy jump item to a different jump group">
                            <mat-icon>content_copy</mat-icon>
                        </button>
                        <button mat-icon-button color="primary" (click)="editShellJumpHandler(row)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="deleteShellJumpHandler(row)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </mat-cell>
                </ng-container>

                <!-- Header / Rows -->
                <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                <mat-header-row *matHeaderRowDef="['loader']; sticky: true" class="progress-row"
                    [class.hidden]="!isLoading"></mat-header-row>
                <mat-row class="selectable" *matRowDef="let row; columns: displayedColumns"></mat-row>

                <!-- No-data -->
                <tr class="mat-row" *matNoDataRow style="display: flex">
                    <td class="mat-cell full-width pt-12" [attr.colspan]="displayedColumns.length">
                        No Shell Jump assets found
                    </td>
                </tr>
            </mat-table>

            <mat-paginator #tablePaginator [length]="dataCount" [pageSize]="defaultPageSize"
                [pageSizeOptions]="pageSizeOptions" showFirstLastButtons></mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
