<div class="relative overlay-container">

    <!-- Progress (matches jumpoint-installer-download-overlay pattern) -->
    <div class="absolute overlay-loader" *ngIf="isDeploying">
        <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
    </div>

    <!-- Close (matches jump-group-update-overlay pattern) -->
    <button mat-mini-fab color="primary" class="overlay-close-button" *ngIf="!isDeploying" (click)="dialogRef.close()"
        matTooltip="Close">
        <mat-icon>close</mat-icon>
    </button>

    <h2 matDialogTitle class="mb-32">Deploy Jumpoint Service</h2>

    <!-- Jumpoint info panel -->
    <div class="jumpoint-info">
        <div class="info-label">Jumpoint</div>
        <div class="info-value">{{ data.jumpointName }}</div>
        <div fxLayout="row" fxLayoutGap="16px" style="margin-top: 6px;">
            <div>
                <span class="info-label">Site Key:&nbsp;</span>
                <span class="info-value">{{ data.siteKey }}</span>
            </div>
            <div>
                <span class="info-label">Business Unit:&nbsp;</span>
                <span class="info-value">{{ data.businessUnit }}</span>
            </div>
        </div>
    </div>

    <!-- Deployment step list -->
    <div class="step-list">
        <div *ngFor="let step of deploymentSteps" class="step-item" fxLayout="row" fxLayoutAlign="start center"
            fxLayoutGap="12px">

            <!-- Status icon -->
            <mat-icon class="step-icon" [color]="getStepIconColor(step.status)">
                {{ getStepIcon(step.status) }}
            </mat-icon>

            <!-- Step text -->
            <div class="step-content" fxFlex>
                <div class="step-label" [class.is-running]="step.status === 'running'">
                    {{ step.label }}
                </div>
                <div class="step-description">{{ step.description }}</div>
                <!-- Detail line: shows certname / serviceType etc. when step is completed -->
                <div class="step-detail"
                    *ngIf="step.detail && (step.status === 'success' || step.status === 'skipped')">
                    {{ step.detail }}
                </div>
                <div class="step-error" *ngIf="step.error">{{ step.error }}</div>
            </div>

            <!-- Inline spinner for running state -->
            <mat-spinner *ngIf="step.status === 'running'" class="step-spinner" [diameter]="20" color="primary">
            </mat-spinner>

        </div>
    </div>

    <!-- Actions -->
    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px" class="mt-24">

        <!-- Start / Retry — only when there are steps to run and we are idle -->
        <button mat-raised-button color="primary" *ngIf="!deploymentComplete && !isDeploying && hasAnyPendingStep"
            (click)="startDeployment()">
            {{ retryLabel }}
        </button>

        <!-- Visual placeholder shown while deploying (not clickable) -->
        <button mat-raised-button color="primary" disabled *ngIf="isDeploying">
            <mat-icon style="font-size: 18px; height: 18px; width: 18px; vertical-align: middle; margin-right: 4px;">
                hourglass_top
            </mat-icon>
            Deploying...
        </button>

    </div>

</div>
