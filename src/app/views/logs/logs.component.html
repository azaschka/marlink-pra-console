<mat-card class="p-0" [@animate]="{ value: '*', params: { y: '50px', delay: '300ms' } }">
    <mat-card-content class="p-0">
        <mat-table [dataSource]="dataSource"> <!-- matSort -->

            <!-- Loader Row -->
            <ng-container matColumnDef="loader">
                <mat-header-cell *matHeaderCellDef [attr.colspan]="displayedColumns.length">
                    <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
                </mat-header-cell>
                <mat-cell *matCellDef="let _"></mat-cell>
            </ng-container>

            <!-- Status -->
            <ng-container matColumnDef="status">
                <mat-header-cell *matHeaderCellDef></mat-header-cell>
                <mat-cell *matCellDef="let row">
                    <div class="status-light" [ngClass]="isError(row) ? 'error' : 'info'"
                        [matTooltip]="isError(row) ? 'Error' : 'Info'">
                    </div>
                </mat-cell>
            </ng-container>

            <!-- ServiceName mat-sort-header -->
            <ng-container matColumnDef="serviceName">
                <mat-header-cell *matHeaderCellDef>Service</mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.serviceName }}</mat-cell>
            </ng-container>

            <!-- ActionType mat-sort-header -->
            <ng-container matColumnDef="actionType">
                <mat-header-cell *matHeaderCellDef>Type</mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.actionType }}</mat-cell>
            </ng-container>

            <!-- ActionName mat-sort-header -->
            <ng-container matColumnDef="actionName">
                <mat-header-cell *matHeaderCellDef>Action</mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.actionName }}</mat-cell>
            </ng-container>

            <!-- TransactionId mat-sort-header -->
            <ng-container matColumnDef="transactionId">
                <mat-header-cell *matHeaderCellDef>Transaction&nbsp;ID</mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.transactionId }}</mat-cell>
            </ng-container>

            <!-- InitiatedBy mat-sort-header -->
            <!-- <ng-container matColumnDef="initiatedBy">
                <mat-header-cell *matHeaderCellDef >Initiated&nbsp;By</mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.initiatedBy || '—' }}</mat-cell>
            </ng-container> -->

            <!-- CreationDate mat-sort-header -->
            <ng-container matColumnDef="creationDate">
                <mat-header-cell *matHeaderCellDef>Date</mat-header-cell>
                <mat-cell *matCellDef="let row">
                    {{ row.creationDate | date: 'dd.MM.yy - HH:mm:ss' }}
                </mat-cell>
            </ng-container>

            <!-- Header & Progress -->
            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-header-row *matHeaderRowDef="['loader']; sticky: true" class="progress-row"
                [class.hidden]="!isLoading"></mat-header-row>

            <!-- Data Rows -->
            <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>

            <!-- No-Data -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell full-width pt-12">
                    No log entries found.
                </td>
            </tr>
        </mat-table>

        <mat-paginator #tablePaginator [length]="dataCount" [pageSize]="defaultPageSize"
            [pageSizeOptions]="pageSizeOptions" showFirstLastButtons (page)="onPage($event)"></mat-paginator>
    </mat-card-content>
</mat-card>
