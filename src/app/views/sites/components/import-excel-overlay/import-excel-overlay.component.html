<div class="relative overlay-container">
    <div *ngIf="isLoading" class="absolute overlay-loader">
        <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
    </div>

    <button *ngIf="!isLoading" mat-mini-fab color="primary" class="overlay-close-button" (click)="close()">
        <mat-icon>close</mat-icon>
    </button>

    <h2 matDialogTitle>{{ headline }}</h2>

    <div style="width: 640px;">
        <ng-container [ngSwitch]="importState">
            <!-- 1. Excel Upload/Parse -->
            <app-excel-import-dragdrop *ngSwitchCase="'idle'"
                (parsed)="onExcelParsed($event)"></app-excel-import-dragdrop>

            <!-- 2. Preview -->
            <app-excel-import-preview *ngSwitchCase="'preview'" [preview]="previewData"
                (startImport)="startImport()"></app-excel-import-preview>

            <!-- 3. Import Progress -->
            <app-excel-import-progress *ngSwitchCase="'importing'" [steps]="importSteps"></app-excel-import-progress>

            <!-- 4. Import Success -->
            <app-excel-import-result *ngSwitchCase="'success'" [result]="importResult"
                (reset)="reset($event)"></app-excel-import-result>

            <!-- 5. Import Error -->
            <app-excel-import-result *ngSwitchCase="'error'" [result]="importResult" [error]="hasError"
                (reset)="reset($event)"></app-excel-import-result>
        </ng-container>
    </div>
</div>
