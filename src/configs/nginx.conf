server {
    listen 80 default_server;

    # Root directory for assets
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------
    # 1.  Compression
    # ------------------------------------------------------------
    gzip  on;
    gzip_comp_level  6;                  # 6 = best balance CPU / ratio
    gzip_disable     "MSIE [1-6]\.";     # same as before
    gzip_min_length  256;
    gzip_vary        on;
    gzip_types
        text/plain text/css
        application/json
        application/javascript application/x-javascript
        text/xml application/xml application/xml+rss
        font/ttf font/otf application/font-woff
        image/svg+xml;

    # ------------------------------------------------------------
    # 2.  Cache-Control for static assets built with content hash
    # ------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|webp)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------
    # 3.  Main SPA route – HTML must not be cached
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html =404;
        # Prevent stale HTML in client-side cache
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------
    # 4.  Basic security headers (optional – adjust to your CSP)
    # ------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options "SAMEORIGIN"        always;
    add_header Referrer-Policy "strict-origin-when-cross-origin"  always;

    # ------------------------------------------------------------
    # 5.  Disable unnecessary logging of health probes
    # ------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 'ok';
    }
}
